name: Render Video Short

# This tells GitHub to listen for a webhook from n8n
on:
  repository_dispatch:
    types: [create_short]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg and Video Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install yt-dlp

      - name: Run Video Processor
        run: |
          python make_short.py \
            --url "${{ github.event.client_payload.url }}" \
            --start "${{ github.event.client_payload.start }}" \
            --end "${{ github.event.client_payload.end }}" \
            --design "${{ github.event.client_payload.design }}"

      - name: Upload to Free Temp Storage (File.io)
        id: upload
        continue-on-error: true # If this fails, it won't crash the next step!
        run: |
          echo "Uploading to file.io..."
          curl -F "file=@output.mp4" https://file.io

      - name: Save as GitHub Artifact (Guaranteed Backup)
        uses: actions/upload-artifact@v4
        if: always() # This forces the video to save even if the upload step fails
        with:
          name: final-short-video
          path: output.mp4
