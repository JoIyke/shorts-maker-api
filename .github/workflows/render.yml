name: Video Processing Service

on:
  repository_dispatch:
    types: [create_short, download_youtube]

# THE NUCLEAR SSL FIX: Forces 'requests' and 'yt-dlp' to use the server's root certificates
env:
  REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
  SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python with Caching
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq ca-certificates
          sudo update-ca-certificates
          
          pip install -U "yt-dlp[default]"
          pip install -r requirements.txt
          
          if [ ! -f "font.ttf" ]; then
            wget https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf -O font.ttf
          fi

      - name: Save Payload to File Safely
        run: |
          jq '.client_payload.data' "$GITHUB_EVENT_PATH" > payload.json

      - name: Run YouTube Downloader
        if: github.event.action == 'download_youtube'
        run: |
          python download_youtube.py --payload_file payload.json

      - name: Run Short Creator
        if: github.event.action == 'create_short'
        run: |
          python main.py --payload_file payload.json

      - name: Send Webhook back to n8n
        if: always()
        run: |
          WEBHOOK_URL=$(jq -r '.webhook_url' payload.json)
          JOB_ID=$(jq -r '.job_id' payload.json)

          if [ -f "output.mp4" ]; then
            echo "Uploading output.mp4 to n8n..."
            curl -X POST "$WEBHOOK_URL" \
              -F "file=@output.mp4" \
              -F "job_id=$JOB_ID"
          else
            echo "output.mp4 was not created. Sending error notice to n8n..."
            curl -X POST "$WEBHOOK_URL" \
              -F "status=error" \
              -F "job_id=$JOB_ID"
          fi
