name: Render Video Short

on:
  repository_dispatch:
    types: [create_short]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg, Fonts, and Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq
          pip install -r requirements.txt
          wget https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf -O font.ttf

      - name: Save Payload to File
        run: |
          # We now extract 'client_payload.data'
          echo '${{ toJson(github.event.client_payload.data) }}' > payload.json

      - name: Run Video Processor
        run: |
          python main.py --payload_file payload.json

      - name: Send Webhook back to n8n
        if: always()
        run: |
          curl -X POST "${{ github.event.client_payload.data.webhook_url }}" \
            -F "file=@output.mp4" \
            -F "job_id=${{ github.event.client_payload.data.job_id }}"
