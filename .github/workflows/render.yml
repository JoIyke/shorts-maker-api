name: Render Video Short

on:
  repository_dispatch:
    types: [create_short]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg and Video Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq
          pip install -r requirements.txt

      - name: Run Video Processor
        run: |
          python main.py \
            --url "${{ github.event.client_payload.url }}" \
            --start "${{ github.event.client_payload.start }}" \
            --end "${{ github.event.client_payload.end }}" \
            --design "${{ github.event.client_payload.design }}"

      - name: Upload to Free Temp Storage (File.io)
        id: upload
        continue-on-error: true
        run: |
          echo "Uploading to file.io..."
          # Upload the file and capture the JSON response
          RESPONSE=$(curl -F "file=@output.mp4" https://file.io)
          
          # Extract just the link from the JSON using jq
          LINK=$(echo $RESPONSE | jq -r '.link')
          echo "TEMP_LINK=$LINK" >> $GITHUB_ENV
          echo "Temporary link created: $LINK"

      - name: Send Webhook back to n8n
        if: always()
        run: |
          echo "Sending file and original data back to n8n..."
          curl -X POST "${{ github.event.client_payload.webhook_url }}" \
            -F "file=@output.mp4" \
            -F "job_id=${{ github.event.client_payload.job_id }}" \
            -F "url=${{ github.event.client_payload.url }}" \
            -F "start=${{ github.event.client_payload.start }}" \
            -F "end=${{ github.event.client_payload.end }}" \
            -F "design=${{ github.event.client_payload.design }}" \
            -F "temp_storage_link=${{ env.TEMP_LINK }}"

      - name: Save as GitHub Artifact (Backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          # This dynamically names the zip file using your job_id!
          name: final-short-${{ github.event.client_payload.job_id }}
          path: output.mp4
