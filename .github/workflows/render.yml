name: Render Video Short

on:
  repository_dispatch:
    types: [create_short]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install FFmpeg, Fonts, and Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg jq
          pip install -r requirements.txt
          wget https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf -O font.ttf

      - name: Save Payload to File Safely
        run: |
          # Use jq to read directly from the GitHub event file on disk.
          # This is 100% immune to quotes, apostrophes, or special characters!
          jq '.client_payload.data' "$GITHUB_EVENT_PATH" > payload.json

      - name: Run Video Processor
        run: |
          python main.py --payload_file payload.json

      - name: Send Webhook back to n8n
        if: always()
        run: |
          # Extract values safely using jq for curl
          WEBHOOK_URL=$(jq -r '.webhook_url' payload.json)
          JOB_ID=$(jq -r '.job_id' payload.json)

          if [ -f "output.mp4" ]; then
            echo "Uploading output.mp4 to n8n..."
            curl -X POST "$WEBHOOK_URL" \
              -F "file=@output.mp4" \
              -F "job_id=$JOB_ID"
          else
            echo "output.mp4 was not created. Sending error notice to n8n..."
            curl -X POST "$WEBHOOK_URL" \
              -F "status=error" \
              -F "job_id=$JOB_ID"
          fi
