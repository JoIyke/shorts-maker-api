name: Render Video Short

on:
  repository_dispatch:
    types: [create_short]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Uses fast pip caching
      - name: Set up Python with Caching
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # NO APT-GET NEEDED! FFmpeg & jq are already pre-installed on GitHub Actions.
      - name: Install Python Packages and Fonts (Ultra-Fast)
        run: |
          pip install -r requirements.txt
          if [ ! -f "font.ttf" ]; then
            wget -q https://github.com/google/fonts/raw/main/ofl/anton/Anton-Regular.ttf -O font.ttf
          fi

      - name: Save Payload to File Safely
        run: |
          jq '.client_payload.data' "$GITHUB_EVENT_PATH" > payload.json

      - name: Run Video Processor
        run: |
          python main.py --payload_file payload.json

      - name: Send Webhook back to n8n
        if: always()
        run: |
          WEBHOOK_URL=$(jq -r '.webhook_url' payload.json)
          JOB_ID=$(jq -r '.job_id' payload.json)

          if [ -f "output.mp4" ]; then
            echo "Uploading output.mp4 to n8n..."
            curl -X POST "$WEBHOOK_URL" \
              -F "file=@output.mp4" \
              -F "job_id=$JOB_ID"
          else
            echo "output.mp4 was not created. Sending error notice to n8n..."
            curl -X POST "$WEBHOOK_URL" \
              -F "status=error" \
              -F "job_id=$JOB_ID"
          fi
